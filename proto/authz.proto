syntax = "proto3";

package acme.v1;

import "buf/validate/validate.proto";
import "proto/widgets.proto";

// Authorization as refinement types: each RPC's wire request is a
// (Principal, plain request) product whose message-level CEL rules are the
// authorization policy. The generated AcmeValid.* structures carry those
// rules as dependent propositions, so a handler holding a validated request
// holds a *proof* that the policy was satisfied — authz by construction.

// An authenticated caller. Identity comes from the (future) authentication
// layer; role_level encodes RBAC rank: 1 viewer, 2 editor, 3 admin.
message Principal {
  uint64 id = 1 [(buf.validate.field).uint64.gt = 0];
  uint32 role_level = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 3}];
}

message CheckedCreateWidgetRequest {
  Principal principal = 1 [(buf.validate.field).required = true];
  CreateWidgetRequest request = 2 [(buf.validate.field).required = true];
  // Callers may only create widgets for themselves...
  option (buf.validate.message).cel = {
    id: "authz.create.self",
    message: "principal may only create widgets for itself",
    expression: "this.principal.id == this.request.user_id"
  };
  // ... and creation requires editor rank.
  option (buf.validate.message).cel = {
    id: "authz.create.editor",
    message: "creating widgets requires role_level >= 2 (editor)",
    expression: "this.principal.role_level >= 2u"
  };
}

message CheckedGetWidgetRequest {
  Principal principal = 1 [(buf.validate.field).required = true];
  GetWidgetRequest request = 2 [(buf.validate.field).required = true];
  // Any authenticated principal (role_level >= 1 by Principal's own rules)
  // may read; no additional policy.
}

message CheckedListWidgetsRequest {
  Principal principal = 1 [(buf.validate.field).required = true];
  ListWidgetsRequest request = 2 [(buf.validate.field).required = true];
  // Callers list their own widgets unless they are admin.
  option (buf.validate.message).cel = {
    id: "authz.list.self_or_admin",
    message: "principal may only list its own widgets unless admin",
    expression: "this.principal.role_level == 3u || this.principal.id == this.request.user_id"
  };
}

message CheckedUpdateWidgetRequest {
  Principal principal = 1 [(buf.validate.field).required = true];
  UpdateWidgetRequest request = 2 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "authz.update.self",
    message: "principal may only update widgets on its own behalf",
    expression: "this.principal.id == this.request.user_id"
  };
  option (buf.validate.message).cel = {
    id: "authz.update.editor",
    message: "updating widgets requires role_level >= 2 (editor)",
    expression: "this.principal.role_level >= 2u"
  };
  // Deep traversal: the widget inside the plain request must also belong to
  // the principal (three hops, through two value-or-default views).
  option (buf.validate.message).cel = {
    id: "authz.update.widget_owner",
    message: "updated widget must be owned by the principal",
    expression: "!has(this.request.widget) || this.request.widget.owner_id == this.principal.id"
  };
}

message CheckedDeleteWidgetRequest {
  Principal principal = 1 [(buf.validate.field).required = true];
  DeleteWidgetRequest request = 2 [(buf.validate.field).required = true];
  // Self-service delete, or admin override.
  option (buf.validate.message).cel = {
    id: "authz.delete.self_or_admin",
    message: "only the owner or an admin may delete",
    expression: "this.principal.role_level == 3u || this.principal.id == this.request.user_id"
  };
}
